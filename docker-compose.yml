version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: smartmenu-postgres
    environment:
      POSTGRES_USER: smartmenu_user
      POSTGRES_PASSWORD: smartmenu_pass
      POSTGRES_DB: smartmenu_db
    ports:
    - 5432:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U smartmenu_user -d smartmenu_db
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - smartmenu-network
  menu-service:
    build:
      context: ./services/menu-service
      dockerfile: Dockerfile
    container_name: smartmenu-menu-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://smartmenu_user:smartmenu_pass@postgres:5432/smartmenu_db
      DEBUG: 'True'
    ports:
    - 8001:8001
    networks:
    - smartmenu-network
    restart: unless-stopped
    logging: &id001
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    env_file: ./services/menu-service/.env
  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: smartmenu-order-service
    depends_on:
      postgres:
        condition: service_healthy
      menu-service:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://smartmenu_user:smartmenu_pass@postgres:5432/smartmenu_orders_db
      MENU_SERVICE_URL: http://menu-service:8001
      DEBUG: 'True'
    ports:
    - 8002:8002
    networks:
    - smartmenu-network
    restart: unless-stopped
    logging: *id001
    env_file: ./services/order-service/.env
  chatbot-service:
    build:
      context: ./services/chatbot-service
      dockerfile: Dockerfile
    container_name: smartmenu-chatbot-service
    depends_on:
      postgres:
        condition: service_healthy
      menu-service:
        condition: service_started
      order-service:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://smartmenu_user:smartmenu_pass@postgres:5432/smartmenu_chatbot_db
      MENU_SERVICE_URL: http://menu-service:8001
      ORDER_SERVICE_URL: http://order-service:8002
      DEBUG: 'True'
    ports:
    - 8003:8003
    networks:
    - smartmenu-network
    restart: unless-stopped
    logging: *id001
    env_file: ./services/chatbot-service/.env
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: smartmenu-user-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://smartmenu_user:smartmenu_pass@postgres:5432/smartmenu_users_db
      DEBUG: 'True'
    ports:
    - 8004:8004
    networks:
    - smartmenu-network
    restart: unless-stopped
    logging: *id001
    env_file: ./services/user-service/.env
  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    container_name: smartmenu-payment-service
    depends_on:
      postgres:
        condition: service_healthy
      order-service:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://smartmenu_user:smartmenu_pass@postgres:5432/smartmenu_payments_db
      ORDER_SERVICE_URL: http://order-service:8002
      USER_SERVICE_URL: http://user-service:8004
      DEBUG: 'True'
    ports:
    - 8005:8005
    networks:
    - smartmenu-network
    restart: unless-stopped
    logging: *id001
    env_file: ./services/payment-service/.env
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: smartmenu-notification-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://smartmenu_user:smartmenu_pass@postgres:5432/smartmenu_notifications_db
      DEBUG: 'True'
    ports:
    - 8006:8006
    networks:
    - smartmenu-network
    restart: unless-stopped
    logging: *id001
    env_file: ./services/notification-service/.env
  analytics-service:
    build:
      context: ./services/analytics-service
      dockerfile: Dockerfile
    container_name: smartmenu-analytics-service
    depends_on:
      menu-service:
        condition: service_started
      order-service:
        condition: service_started
    environment:
      MENU_SERVICE_URL: http://menu-service:8001
      ORDER_SERVICE_URL: http://order-service:8002
      PAYMENT_SERVICE_URL: http://payment-service:8005
      DEBUG: 'True'
    ports:
    - 8007:8007
    networks:
    - smartmenu-network
    restart: unless-stopped
    logging: *id001
  api-gateway:
    image: nginx:alpine
    container_name: smartmenu-api-gateway
    depends_on:
    - menu-service
    - order-service
    - chatbot-service
    - user-service
    - payment-service
    - notification-service
    - analytics-service
    volumes:
    - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
    - 80:80
    networks:
    - smartmenu-network
    restart: unless-stopped
    logging: *id001
volumes:
  postgres_data:
    driver: local
networks:
  smartmenu-network:
    driver: bridge
