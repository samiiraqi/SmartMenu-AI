# ============================================
# ORDER SERVICE
# ============================================
# Manages customer orders
# ============================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: smartmenu
  labels:
    app: order-service
spec:
  replicas: 2
  
  selector:
    matchLabels:
      app: order-service
  
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: ECR_REGISTRY/smartmenu-order-service:IMAGE_TAG
          
          ports:
            - containerPort: 8002
              name: http
          
          env:
            - name: PORT
              value: "8002"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: smartmenu-secrets
                  key: database_url
            - name: MENU_SERVICE_URL
              value: "http://menu-service:8001"
          
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 10
          
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 5
          
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: smartmenu
  labels:
    app: order-service
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - port: 8002
      targetPort: 8002
      protocol: TCP
      name: http
