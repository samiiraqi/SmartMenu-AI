name: 🚀 App Deploy

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'admin-dashboard/**'
      - 'k8s/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: smartmenu-cluster
  NAMESPACE: smartmenu

permissions:
  id-token: write
  contents: read

jobs:
  # ============================================
  # JOB 1: DETECT CHANGES
  # ============================================
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      menu-service: ${{ steps.filter.outputs.menu-service }}
      order-service: ${{ steps.filter.outputs.order-service }}
      chatbot-service: ${{ steps.filter.outputs.chatbot-service }}
      frontend: ${{ steps.filter.outputs.frontend }}
      k8s: ${{ steps.filter.outputs.k8s }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Detect changed files
        uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            menu-service:
              - 'services/menu-service/**'
            order-service:
              - 'services/order-service/**'
            chatbot-service:
              - 'services/chatbot-service/**'
            frontend:
              - 'admin-dashboard/**'
            k8s:
              - 'k8s/**'

  # ============================================
  # JOB 2: BUILD & TEST (only changed services)
  # ============================================
  build-test:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: |
      needs.detect-changes.outputs.menu-service == 'true' ||
      needs.detect-changes.outputs.order-service == 'true' ||
      needs.detect-changes.outputs.chatbot-service == 'true'
    
    strategy:
      matrix:
        service: [menu-service, order-service, chatbot-service]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # Only run if this specific service changed
      - name: 🔍 Check if service changed
        id: check
        run: |
          SERVICE="${{ matrix.service }}"
          CHANGED="${{ needs.detect-changes.outputs[matrix.service] }}"
          
          if [ "$CHANGED" == "true" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ $SERVICE changed - will test"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "⏭️ $SERVICE unchanged - skipping"
          fi

      - name: 🐍 Setup Python
        if: steps.check.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install dependencies
        if: steps.check.outputs.changed == 'true'
        run: |
          cd services/${{ matrix.service }}
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: 🧪 Run tests
        if: steps.check.outputs.changed == 'true'
        run: |
          cd services/${{ matrix.service }}
          python -m pytest -v || echo "⚠️ No tests found"

  # ============================================
  # JOB 3: BUILD & PUSH (only changed services)
  # ============================================
  build-push:
    needs: [detect-changes, build-test]
    runs-on: ubuntu-latest
    if: |
      always() &&
      (needs.build-test.result == 'success' || needs.build-test.result == 'skipped') &&
      github.ref == 'refs/heads/main' &&
      (
        needs.detect-changes.outputs.menu-service == 'true' ||
        needs.detect-changes.outputs.order-service == 'true' ||
        needs.detect-changes.outputs.chatbot-service == 'true' ||
        needs.detect-changes.outputs.frontend == 'true'
      )
    
    strategy:
      matrix:
        include:
          - service: menu-service
            context: ./services/menu-service
            dockerfile: ./services/menu-service/Dockerfile
            changed: ${{ needs.detect-changes.outputs.menu-service }}
          - service: order-service
            context: ./services/order-service
            dockerfile: ./services/order-service/Dockerfile
            changed: ${{ needs.detect-changes.outputs.order-service }}
          - service: chatbot-service
            context: ./services/chatbot-service
            dockerfile: ./services/chatbot-service/Dockerfile
            changed: ${{ needs.detect-changes.outputs.chatbot-service }}
          - service: frontend
            context: ./admin-dashboard
            dockerfile: ./admin-dashboard/Dockerfile
            changed: ${{ needs.detect-changes.outputs.frontend }}
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # Skip if service didn't change
      - name: 🔍 Check if service changed
        id: check
        run: |
          if [ "${{ matrix.changed }}" == "true" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ Building ${{ matrix.service }}"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "⏭️ Skipping ${{ matrix.service }} (no changes)"
          fi

      - name: 🔐 Configure AWS credentials
        if: steps.check.outputs.changed == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔑 Login to Amazon ECR
        if: steps.check.outputs.changed == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🏷️ Set image tag
        id: meta
        run: |
          SHORT_SHA=${GITHUB_SHA:0:8}
          echo "tag=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: 🔨 Build, tag, and push image
        if: steps.check.outputs.changed == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          SERVICE_NAME=${{ matrix.service }}
          IMAGE_NAME="smartmenu-${SERVICE_NAME}"
          FULL_IMAGE="${ECR_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          LATEST_IMAGE="${ECR_REGISTRY}/${IMAGE_NAME}:latest"
          
          echo "🔨 Building ${SERVICE_NAME}..."
          
          # Create ECR repository if it doesn't exist
          aws ecr describe-repositories --repository-names "${IMAGE_NAME}" 2>/dev/null || \
            aws ecr create-repository --repository-name "${IMAGE_NAME}"
          
          # Build image
          docker build -t "${FULL_IMAGE}" -f ${{ matrix.dockerfile }} ${{ matrix.context }}
          
          # Tag as latest
          docker tag "${FULL_IMAGE}" "${LATEST_IMAGE}"
          
          # Push both tags
          docker push "${FULL_IMAGE}"
          docker push "${LATEST_IMAGE}"
          
          echo "✅ Pushed: ${FULL_IMAGE}"
          echo "✅ Pushed: ${LATEST_IMAGE}"

  # ============================================
  # JOB 4: DEPLOY TO KUBERNETES
  # ============================================
  deploy:
    needs: [detect-changes, build-push]
    runs-on: ubuntu-latest
    if: |
      always() &&
      (needs.build-push.result == 'success' || needs.build-push.result == 'skipped') &&
      github.ref == 'refs/heads/main' &&
      (
        needs.detect-changes.outputs.menu-service == 'true' ||
        needs.detect-changes.outputs.order-service == 'true' ||
        needs.detect-changes.outputs.chatbot-service == 'true' ||
        needs.detect-changes.outputs.frontend == 'true' ||
        needs.detect-changes.outputs.k8s == 'true'
      )
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔧 Setup kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: ⚙️ Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: 📦 Create namespace
        run: |
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: 🔑 Get ECR registry
        id: ecr
        run: |
          REGISTRY=$(aws ecr describe-repositories \
            --repository-names smartmenu-menu-service \
            --query 'repositories[0].repositoryUri' \
            --output text | cut -d'/' -f1)
          echo "registry=${REGISTRY}" >> $GITHUB_OUTPUT

      - name: 🚀 Deploy changed services
        env:
          IMAGE_TAG: ${{ needs.build-push.outputs.image-tag }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          SHORT_TAG=${IMAGE_TAG:-latest}
          
          echo "📦 Deploying changed services..."
          echo "Image tag: ${SHORT_TAG}"
          
          # Deploy only changed services
          if [ "${{ needs.detect-changes.outputs.menu-service }}" == "true" ]; then
            echo "✅ Deploying menu-service"
            sed -e "s|IMAGE_TAG|${SHORT_TAG}|g" -e "s|ECR_REGISTRY|${ECR_REGISTRY}|g" \
              k8s/menu-service.yaml | kubectl -n ${{ env.NAMESPACE }} apply -f -
          fi
          
          if [ "${{ needs.detect-changes.outputs.order-service }}" == "true" ]; then
            echo "✅ Deploying order-service"
            sed -e "s|IMAGE_TAG|${SHORT_TAG}|g" -e "s|ECR_REGISTRY|${ECR_REGISTRY}|g" \
              k8s/order-service.yaml | kubectl -n ${{ env.NAMESPACE }} apply -f -
          fi
          
          if [ "${{ needs.detect-changes.outputs.chatbot-service }}" == "true" ]; then
            echo "✅ Deploying chatbot-service"
            sed -e "s|IMAGE_TAG|${SHORT_TAG}|g" -e "s|ECR_REGISTRY|${ECR_REGISTRY}|g" \
              k8s/chatbot-service.yaml | kubectl -n ${{ env.NAMESPACE }} apply -f -
          fi
          
          if [ "${{ needs.detect-changes.outputs.frontend }}" == "true" ]; then
            echo "✅ Deploying frontend"
            sed -e "s|IMAGE_TAG|${SHORT_TAG}|g" -e "s|ECR_REGISTRY|${ECR_REGISTRY}|g" \
              k8s/frontend.yaml | kubectl -n ${{ env.NAMESPACE }} apply -f -
          fi
          
          # Always apply ingress if k8s files changed
          if [ "${{ needs.detect-changes.outputs.k8s }}" == "true" ]; then
            echo "✅ Updating Ingress"
            kubectl -n ${{ env.NAMESPACE }} apply -f k8s/ingress.yaml
          fi
          
          # Apply namespace if it changed
          kubectl apply -f k8s/namespace.yaml

      - name: ⏳ Wait for deployments
        run: |
          echo "Waiting for changed deployments..."
          
          if [ "${{ needs.detect-changes.outputs.menu-service }}" == "true" ]; then
            kubectl -n ${{ env.NAMESPACE }} rollout status deployment/menu-service --timeout=300s || true
          fi
          
          if [ "${{ needs.detect-changes.outputs.order-service }}" == "true" ]; then
            kubectl -n ${{ env.NAMESPACE }} rollout status deployment/order-service --timeout=300s || true
          fi
          
          if [ "${{ needs.detect-changes.outputs.chatbot-service }}" == "true" ]; then
            kubectl -n ${{ env.NAMESPACE }} rollout status deployment/chatbot-service --timeout=300s || true
          fi
          
          if [ "${{ needs.detect-changes.outputs.frontend }}" == "true" ]; then
            kubectl -n ${{ env.NAMESPACE }} rollout status deployment/frontend --timeout=300s || true
          fi

      - name: 🌐 Get Application URL
        run: |
          URL=$(kubectl -n ${{ env.NAMESPACE }} get svc frontend-service \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
          
          if [ -n "$URL" ]; then
            echo "✅ Application URL: http://$URL"
          else
            echo "⚠️ Load Balancer not ready yet"
          fi

      - name: 📊 Deployment Summary
        run: |
          echo "## 🚀 Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Changed Services" >> $GITHUB_STEP_SUMMARY
          echo "- menu-service: ${{ needs.detect-changes.outputs.menu-service }}" >> $GITHUB_STEP_SUMMARY
          echo "- order-service: ${{ needs.detect-changes.outputs.order-service }}" >> $GITHUB_STEP_SUMMARY
          echo "- chatbot-service: ${{ needs.detect-changes.outputs.chatbot-service }}" >> $GITHUB_STEP_SUMMARY
          echo "- frontend: ${{ needs.detect-changes.outputs.frontend }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Pods Status" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl -n ${{ env.NAMESPACE }} get pods >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
