name: 🏗️ Infrastructure Deploy

# Manual trigger ONLY - Won't run automatically
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to do?'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan      # Preview changes (FREE - doesn't create anything)
          - apply     # Create infrastructure (COSTS MONEY)
          - destroy   # Delete everything (STOPS COSTS)

env:
  AWS_REGION: us-east-1
  TF_BACKEND_BUCKET: smartmenu-terraform-state
  TF_BACKEND_KEY: smartmenu/terraform.tfstate
  TF_LOCK_TABLE: smartmenu-terraform-locks

permissions:
  id-token: write   # Required for OIDC (secure AWS login)
  contents: read

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    
    steps:
      # ============================================
      # STEP 1: Get code from GitHub
      # ============================================
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # ============================================
      # STEP 2: Login to AWS (using OIDC - secure!)
      # ============================================
      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ============================================
      # STEP 3: Install Terraform
      # ============================================
      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      # ============================================
      # STEP 4: Create S3 backend (if not exists)
      # This stores Terraform state
      # ============================================
      - name: 📦 Create S3 backend (if not exists)
        if: ${{ github.event.inputs.action != 'destroy' }}
        run: |
          echo "Checking if S3 bucket exists..."
          if ! aws s3api head-bucket --bucket "$TF_BACKEND_BUCKET" 2>/dev/null; then
            echo "Creating S3 bucket for Terraform state..."
            aws s3api create-bucket \
              --bucket "$TF_BACKEND_BUCKET" \
              --region "$AWS_REGION"
            
            echo "Enabling versioning..."
            aws s3api put-bucket-versioning \
              --bucket "$TF_BACKEND_BUCKET" \
              --versioning-configuration Status=Enabled
            
            echo "Blocking public access..."
            aws s3api put-public-access-block \
              --bucket "$TF_BACKEND_BUCKET" \
              --public-access-block-configuration \
              "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
            
            echo "✅ S3 bucket created!"
          else
            echo "✅ S3 bucket already exists"
          fi

      # ============================================
      # STEP 5: Create DynamoDB lock table
      # This prevents concurrent Terraform runs
      # ============================================
      - name: 🔒 Create DynamoDB lock table (if not exists)
        if: ${{ github.event.inputs.action != 'destroy' }}
        run: |
          echo "Checking if DynamoDB table exists..."
          if ! aws dynamodb describe-table --table-name "$TF_LOCK_TABLE" 2>/dev/null; then
            echo "Creating DynamoDB table for state locking..."
            aws dynamodb create-table \
              --table-name "$TF_LOCK_TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST
            
            echo "Waiting for table to be active..."
            sleep 10
            echo "✅ DynamoDB table created!"
          else
            echo "✅ DynamoDB table already exists"
          fi

      # ============================================
      # STEP 6: Initialize Terraform
      # ============================================
      - name: 🚀 Terraform Init
        run: |
          cd infra
          terraform init \
            -backend-config="bucket=$TF_BACKEND_BUCKET" \
            -backend-config="key=$TF_BACKEND_KEY" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="dynamodb_table=$TF_LOCK_TABLE" \
            -backend-config="encrypt=true"

      # ============================================
      # STEP 7: Validate Terraform files
      # ============================================
      - name: ✅ Terraform Validate
        run: |
          cd infra
          terraform validate

      # ============================================
      # STEP 8: Terraform Plan (preview)
      # ============================================
      - name: 📋 Terraform Plan
        if: ${{ github.event.inputs.action == 'plan' }}
        run: |
          cd infra
          echo "🔍 PLAN MODE - Showing what will be created (FREE)"
          terraform plan -input=false

      # ============================================
      # STEP 9: Terraform Apply (create!)
      # ============================================
      - name: 🏗️ Terraform Apply
        if: ${{ github.event.inputs.action == 'apply' }}
        run: |
          cd infra
          echo "⚠️ APPLY MODE - Creating infrastructure (COSTS MONEY)"
          terraform apply -auto-approve -input=false

      # ============================================
      # STEP 10: Terraform Destroy (delete!)
      # ============================================
      - name: 💥 Terraform Destroy
        if: ${{ github.event.inputs.action == 'destroy' }}
        run: |
          cd infra
          echo "🗑️ DESTROY MODE - Deleting all infrastructure (STOPS COSTS)"
          terraform destroy -auto-approve -input=false

      # ============================================
      # STEP 11: Show outputs (after apply)
      # ============================================
      - name: 📊 Show Outputs
        if: ${{ github.event.inputs.action == 'apply' }}
        run: |
          cd infra
          terraform output
