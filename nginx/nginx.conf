events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=30s;
    
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    server {
        listen 80;
        server_name localhost;
        
        limit_conn addr 10;
        client_max_body_size 10M;

        location /health {
            add_header 'Access-Control-Allow-Origin' '*' always;
            return 200 "API Gateway is healthy\n";
            add_header Content-Type text/plain;
        }

        location /api/menu/ {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
            
            if ($request_method = OPTIONS) {
                return 204;
            }
            
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://menu-service:8001/api/v1/menu/;
            proxy_set_header Host $host;
        }

        location /api/orders/ {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
            
            if ($request_method = OPTIONS) {
                return 204;
            }
            
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://order-service:8002/api/v1/orders/;
            proxy_set_header Host $host;
        }

        location /api/chat/ {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
            
            if ($request_method = OPTIONS) {
                return 204;
            }
            
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://chatbot-service:8003/api/v1/chat/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/users/ {
            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass http://user-service:8004/api/v1/users/;
        }

        location /api/payments/ {
            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass http://payment-service:8005/api/v1/payments/;
        }

        location /api/notifications/ {
            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass http://notification-service:8006/api/v1/notifications/;
        }

        location /api/analytics/ {
            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass http://analytics-service:8007/api/v1/analytics/;
        }
    }
}
